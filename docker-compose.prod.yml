# Production overrides: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Requires a .env next to this file with JWT_SECRET and POSTGRES_PASSWORD (see .env.example).
services:
  db:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

  backend:
    restart: unless-stopped
    # Keep the API internal: nginx (frontend) proxies /api to it.
    ports: !override []
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-quizadmin}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-quizdevdb02}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}

  frontend:
    restart: unless-stopped
    ports: !override
      - "80:80"
