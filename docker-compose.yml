services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quizadmin
      POSTGRES_PASSWORD: quizDev04
      POSTGRES_DB: quizdevdb02
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizadmin -d quizdevdb02"]
      interval: 3s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://quizadmin:quizDev04@db:5432/quizdevdb02
      # Change this for anything beyond local development.
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      PORT: 4000
      RUST_LOG: quiz_backend=debug,tower_http=info
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
